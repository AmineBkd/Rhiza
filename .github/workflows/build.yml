name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            preset: windows
          - os: ubuntu-latest
            preset: linux
          - os: macos-latest
            preset: macos-arm64

    runs-on: ${{ matrix.os }}

    # Without a binary cache every run rebuilds Ogre-Next and its
    # dependencies from source, which is most of the ~45 minutes.
    env:
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg-binary-cache,readwrite

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # The runner image is part of the key because vcpkg's package hashes
      # include the compiler: after a GitHub image update every package
      # misses, and without a new key the rebuilt ones would never be saved.
      - name: Get cache key inputs
        id: cache-inputs
        shell: bash
        run: |
          mkdir -p "${{ github.workspace }}/vcpkg-binary-cache"
          echo "sha=$(git -C third_party/vcpkg rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS}-${ImageVersion}" >> "$GITHUB_OUTPUT"

      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/vcpkg-binary-cache
          key: vcpkg-${{ matrix.preset }}-${{ steps.cache-inputs.outputs.image }}-${{ steps.cache-inputs.outputs.sha }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ matrix.preset }}-

      - name: Install Linux GL/X11 dev packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libgl1-mesa-dev libx11-dev libxext-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libxi-dev libxaw7-dev \
            autoconf autoconf-archive automake libtool libltdl-dev

      - name: Bootstrap vcpkg (Windows)
        if: runner.os == 'Windows'
        run: .\third_party\vcpkg\bootstrap-vcpkg.bat

      - name: Bootstrap vcpkg (Linux/macOS)
        if: runner.os != 'Windows'
        run: ./third_party/vcpkg/bootstrap-vcpkg.sh

      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DCMAKE_BUILD_TYPE=Release

      # Saved straight after vcpkg has run, so a later compile or test
      # failure doesn't throw the packages away.
      - name: Save vcpkg binary cache
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/vcpkg-binary-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
